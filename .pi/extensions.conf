# Suckless Pi - Extensions Configuration
# Format: enable|disable <path>
# See SUCKLESS_EXTENSIONS_MANAGEMENT.md for details
#
# This file contains PROJECT DEFAULTS. Override in ~/.pi/extensions.conf

# ============================================================================
# CORE EXTENSIONS (required for basic functionality)
# ============================================================================
enable extensions/suckless/status-bar.ts
enable extensions/suckless/core-tools.ts
enable extensions/suckless/session-emoji.ts

# ============================================================================
# FUNCTIONAL EXTENSIONS (user-facing features)
# ============================================================================
enable extensions/functional/files-widget/index.ts
enable extensions/functional/planning/index.ts
enable extensions/functional/guardrails/index.ts
enable extensions/functional/sucks-warning/index.ts

# Development tools
enable extensions/functional/extension-dev/index.ts

# Experimental - disabled by default
disable extensions/functional/memory-mode.ts
disable extensions/functional/ralph-loop.ts
disable extensions/functional/test-ext/index.ts

# ============================================================================
# UTILITY EXTENSIONS (tools and integrations)
# ============================================================================
enable extensions/utility/brave-search/index.ts
enable extensions/utility/neovim/index.ts
enable extensions/utility/breadcrumbs/index.ts
enable extensions/utility/checkpoint/index.ts
enable extensions/utility/notification-hook/index.ts
enable extensions/utility/presenter/index.ts
enable extensions/utility/providers/index.ts
enable extensions/utility/review-tools/index.ts
enable extensions/utility/session-naming/index.ts
enable extensions/utility/system-prompt-viewer/index.ts
enable extensions/utility/theme-selector/index.ts
enable extensions/utility/processes/index.ts
enable extensions/utility/subagents/index.ts

# Debugging tools - disabled by default
disable extensions/utility/introspection/index.ts
